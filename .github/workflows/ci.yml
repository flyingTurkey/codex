name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package managers and dependencies
        run: |
          python -m pip install uv==0.11.28
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make contract-test
      - run: make security-check

  integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
      - name: Install pinned test dependencies
        run: |
          python -m pip install uv==0.11.28
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
          pnpm --filter @srbg/web exec playwright install --with-deps chromium
      - run: make dev
      - run: make safety-case-test
      - run: make smoke
      - run: make resilience-test
      - run: make web-e2e
      - run: make web-a11y
      - name: Print service logs after failure
        if: failure()
        run: docker compose -f infra/compose/compose.yaml logs --no-color
      - name: Stop Compose stack
        if: always()
        run: make down
