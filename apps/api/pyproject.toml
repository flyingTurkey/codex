[project]
name = "srbg-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aioboto3==15.5.0",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.139.0",
  "httpx2==2.5.0",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "sqlalchemy==2.0.51",
  "srbg-contracts",
  "uvicorn==0.51.0",
]

[tool.uv.sources]
srbg-contracts = { workspace = true }

[build-system]
requires = ["uv-build==0.11.28"]
build-backend = "uv_build"
