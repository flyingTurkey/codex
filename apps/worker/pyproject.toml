[project]
name = "srbg-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery==5.6.3",
  "srbg-api",
  "srbg-contracts",
]

[tool.uv.sources]
srbg-api = { workspace = true }
srbg-contracts = { workspace = true }

[build-system]
requires = ["uv-build==0.11.28"]
build-backend = "uv_build"
