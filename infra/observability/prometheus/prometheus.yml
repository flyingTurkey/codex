global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: srbg-api
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
