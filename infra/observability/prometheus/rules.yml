groups:
  - name: srbg-slo
    rules:
      - alert: SourceCircuitOpen
        expr: srbg_operations_metric{code="OPEN_SOURCE_CIRCUITS"} > 0
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "来源熔断已打开"}
      - alert: QueueOldestTaskTooOld
        expr: srbg_publisher_outbox_oldest_seconds > 900
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "任务队列最老任务超过15分钟"}
      - alert: ApiAvailabilityBudgetBurn
        expr: sum(rate(srbg_api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(srbg_api_requests_total[5m])), 1) > 0.005
        for: 5m
        labels: {severity: p0}
        annotations: {summary: "API错误预算快速燃烧"}
      - alert: SearchLatencySloBreach
        expr: histogram_quantile(0.95, sum by (le) (rate(srbg_search_duration_seconds_bucket[10m]))) > 0.8
        for: 10m
        labels: {severity: p1}
        annotations: {summary: "搜索P95超过800ms"}
      - alert: BackupVerificationFailed
        expr: srbg_backup_verification_success == 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "自动备份验证失败"}
