groups:
  - name: srbg-pers02
    rules:
      - alert: PersonalSourceProbeQueueStalled
        expr: srbg_personal_source_probe_queue > 0
        for: 15m
        labels: {severity: p2}
        annotations: {summary: "Owner URL probes have remained queued for 15 minutes"}
  - name: srbg-round16
    rules:
      - alert: SourceFalseSuccess
        expr: increase(srbg_source_slo_violations_total{dimension="discovery"}[15m]) > 0
        for: 1m
        labels: {severity: p1}
        annotations: {summary: "HTTP success without usable discovery"}
      - alert: SourceFreshnessSLOViolation
        expr: increase(srbg_source_slo_violations_total{dimension="freshness"}[15m]) > 0
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "Source freshness exceeded its policy-constrained SLO"}
      - alert: FetchQueueBacklog
        expr: srbg_fetch_backlog_age_seconds > 900
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "PostgreSQL fetch backlog is stale"}
      - alert: SafeReplayBlocked
        expr: increase(srbg_replay_results_total{outcome=~"blocked|non_replayable"}[15m]) > 0
        for: 1m
        labels: {severity: p2}
        annotations: {summary: "A replay could not be safely reconstructed"}
      - alert: RetentionExecutionFailure
        expr: increase(srbg_retention_results_total{outcome="failed"}[15m]) > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "Evidence retention execution failed"}
  - name: srbg-slo
    rules:
      - alert: SourceCircuitOpen
        expr: srbg_operations_metric{code="OPEN_SOURCE_CIRCUITS"} > 0
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "来源熔断已打开"}
      - alert: QueueOldestTaskTooOld
        expr: srbg_publisher_outbox_oldest_seconds > 900
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "任务队列最老任务超过15分钟"}
      - alert: ApiAvailabilityBudgetBurn
        expr: sum(rate(srbg_api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(srbg_api_requests_total[5m])), 1) > 0.005
        for: 5m
        labels: {severity: p0}
        annotations: {summary: "API错误预算快速燃烧"}
      - alert: SearchLatencySloBreach
        expr: histogram_quantile(0.95, sum by (le) (rate(srbg_search_duration_seconds_bucket[10m]))) > 0.8
        for: 10m
        labels: {severity: p1}
        annotations: {summary: "搜索P95超过800ms"}
      - alert: BackupVerificationFailed
        expr: srbg_backup_verification_success == 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "自动备份验证失败"}
      - alert: InternalProjectionReconciliationMismatch
        expr: srbg_internal_projection_reconciliation_differences > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "内部发布影子投影存在对账差异"}
      - alert: InternalProjectionStale
        expr: absent(srbg_internal_projection_last_success_timestamp_seconds) or (time() - srbg_internal_projection_last_success_timestamp_seconds > 90000)
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "内部发布影子投影超过25小时未成功生成"}
      - alert: AuditChainAnchorStale
        expr: absent(srbg_audit_chain_anchor_last_success_timestamp_seconds) or (time() - srbg_audit_chain_anchor_last_success_timestamp_seconds > 90000)
        for: 5m
        labels: {severity: p0}
        annotations: {summary: "审计hash链根超过25小时未独立锚定"}
      - alert: EventMigrationBlocked
        expr: srbg_event_migration_records{outcome="blocked"} > 0
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "Item 到 Event 迁移存在人工阻断"}
      - alert: EventConsumerParityMismatch
        expr: srbg_event_consumer_parity_differences > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "Event consumer 切换对账存在差异"}
      - alert: EventAliasResolutionFailure
        expr: increase(srbg_event_alias_resolutions_total{outcome=~"loop|error"}[10m]) > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "Item/Event 别名解析出现循环或错误"}
      - alert: EventIdentityCandidateBacklog
        expr: srbg_event_identity_candidate_backlog > 0
        for: 24h
        labels: {severity: p2}
        annotations: {summary: "Event 模糊身份候选积压超过 24 小时"}
      - alert: EventIdentityRollbackDetected
        expr: increase(srbg_event_identity_rollbacks_total[15m]) > 0
        for: 1m
        labels: {severity: p1}
        annotations: {summary: "Event 身份合并或拆分发生审核回滚"}
      - alert: SourceLifecycleAuthorizationMismatch
        expr: srbg_source_runtime_authorization_mismatches > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "来源生命周期与运行授权不一致，采集必须保持拒绝"}
      - alert: SourcePolicyRejectionSpike
        expr: increase(srbg_source_policy_rejections_total[15m]) > 5
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "来源策略拒绝在短时间内异常增加"}
      - alert: SourceTrialSecurityFailure
        expr: increase(srbg_source_trial_runs_total{outcome="security_failed"}[15m]) > 0
        for: 1m
        labels: {severity: p0}
        annotations: {summary: "来源试运行触发安全失败"}
      - alert: SourceTrialQualityDegraded
        expr: (srbg_source_trial_ready_ratio_basis_points{status="succeeded"} < 8000) or (srbg_source_trial_quality_count{status="succeeded",measure=~"parse_failed_document_raw|security_failed_total|rejected_raw_attempt"} > 0)
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "成功试运行的 READY 比例低于 80%，需要人工复核"}
      - alert: ConnectorConfigValidationFailure
        expr: increase(srbg_connector_config_versions_total{outcome="rejected"}[30m]) > 5
        for: 5m
        labels: {severity: p1}
        annotations: {summary: "声明式连接器配置连续校验失败"}
      - alert: SourceCoverageGapDetected
        expr: srbg_source_coverage_gap_cells > 0
        for: 24h
        labels: {severity: p2}
        annotations: {summary: "核心来源覆盖矩阵仍存在缺口"}
      - alert: SourceProductionSchedulingBlocked
        expr: increase(srbg_source_production_scheduling_blocked_total[15m]) > 0
        for: 1m
        labels: {severity: p1}
        annotations: {summary: "来源生产调度因未绑定受审执行器而保持拒绝"}
      - alert: SourceProfileQueueStalled
        expr: srbg_source_profile_queue > 0
        for: 15m
        labels: {severity: p2}
        annotations: {summary: "自动来源画像队列持续积压超过15分钟"}
      - alert: SourceProfileRetryExhausted
        expr: increase(srbg_source_profile_runs_total{outcome="PARTIAL",reason=~"MODEL_UNAVAILABLE|PROVIDER_BALANCE_INSUFFICIENT|BUDGET_DISABLED"}[30m]) > 5
        for: 5m
        labels: {severity: p2}
        annotations: {summary: "Automatic source profiling repeatedly degraded"}
      - alert: PersonalAiProcessingFailureSpike
        expr: increase(srbg_personal_ai_judgment_results_total{result_type="AI_PROCESSING_FAILED"}[30m]) > 5
        for: 5m
        labels: {severity: p2}
        annotations: {summary: "Personal AI content processing failures increased"}
      - alert: PersonalRelationshipCorrectionFailure
        expr: increase(srbg_personal_relationship_corrections_total{outcome="failed"}[15m]) > 0
        for: 5m
        labels: {severity: p2}
        annotations: {summary: "Owner relationship correction or projection refresh failed"}
      - alert: IntelligenceV2ProjectionSafetyFailure
        expr: increase(srbg_intelligence_v2_publication_decisions_total{outcome="SAFETY_FAILURE"}[15m]) > 0
        for: 1m
        labels: {severity: p1}
        annotations: {summary: "v2 Reader 投影因原文安全或 claim/summary 一致性失败而关闭"}
      - alert: T06AiApprovedContentSuccessStale
        expr: srbg_t06_ai_runtime_state{provider="deepseek",state="configured"} == 1 and srbg_t06_ai_runtime_state{provider="deepseek",state="available"} == 0
        for: 24h
        labels: {severity: p2}
        annotations: {summary: "DeepSeek 已配置但 24 小时内没有满足全部门禁的真实内容成功"}
      - alert: T06AiProjectionRefreshDeadLetter
        expr: increase(srbg_t06_ai_projection_refresh_total{outcome="dead_letter"}[15m]) > 0
        for: 1m
        labels: {severity: p1}
        annotations: {summary: "T06 AI 结果投影补偿已进入死信"}
      - alert: IntelligenceV2HotspotEvaluationRejected
        expr: increase(srbg_intelligence_v2_hotspot_evaluations_total{outcome="REJECTED"}[30m]) > 5
        for: 5m
        labels: {severity: p2}
        annotations: {summary: "v2 热点候选因证据或服务端规则不足连续拒绝"}
