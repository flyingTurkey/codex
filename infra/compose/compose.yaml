name: srbg-intelligence

x-python-environment: &python-environment
  SRBG_ENVIRONMENT: ${SRBG_ENVIRONMENT:-demo}
  SRBG_REDIS_URL: ${SRBG_REDIS_URL:-redis://redis:6379/0}
  SRBG_S3_ENDPOINT_URL: ${SRBG_S3_ENDPOINT_URL:-http://minio:9000}
  SRBG_S3_ACCESS_KEY: ${SRBG_S3_ACCESS_KEY:-srbg_local}
  SRBG_S3_SECRET_KEY: ${SRBG_S3_SECRET_KEY:-srbg_local_storage_only}
  SRBG_S3_BUCKET: ${SRBG_S3_BUCKET:-srbg-raw}
  SRBG_S3_REGION: ${SRBG_S3_REGION:-us-east-1}
  SRBG_CLAMAV_HOST: ${SRBG_CLAMAV_HOST:-clamav}
  SRBG_CLAMAV_PORT: ${SRBG_CLAMAV_PORT:-3310}
  SRBG_EXTERNAL_IO_TIMEOUT_SECONDS: ${SRBG_EXTERNAL_IO_TIMEOUT_SECONDS:-2}
  SRBG_CURSOR_SIGNING_KEY: ${SRBG_CURSOR_SIGNING_KEY:-demo-only-round10-cursor-signing-key}
  SRBG_SEMANTIC_SEARCH_ENABLED: ${SRBG_SEMANTIC_SEARCH_ENABLED:-false}
  SRBG_SEMANTIC_SEARCH_TIMEOUT_SECONDS: ${SRBG_SEMANTIC_SEARCH_TIMEOUT_SECONDS:-0.3}
  SRBG_METRICS_BEARER_TOKEN: ${SRBG_METRICS_BEARER_TOKEN:-demo-only-round11-metrics-token-000000}
  SRBG_OTEL_EXPORTER_OTLP_ENDPOINT: ${SRBG_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  SRBG_SENTRY_DSN: ${SRBG_SENTRY_DSN:-}
  SRBG_OPENALEX_API_KEY: ${SRBG_OPENALEX_API_KEY:-}
  SRBG_ACADEMIC_CONTACT: ${SRBG_ACADEMIC_CONTACT:-data-platform@srbg.local}

x-postgres-build: &postgres-build
  context: .
  dockerfile: infra/compose/Dockerfile.postgres

services:
  postgres:
    image: srbg-postgres:17.10-pgvector-0.8.2
    build: *postgres-build
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srbg}
      POSTGRES_USER: ${POSTGRES_USER:-srbg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srbg_local_only}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/wal-archive
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.2-debian13-slim@sha256:14e2e0805c6a5ff6728ea591c05565e0f0954d93e8701919012c3a8c44e20674
    expose:
      - "3310"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srbg_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srbg_local_storage_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srbg_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srbg_local_storage_only}
      SRBG_S3_BUCKET: ${SRBG_S3_BUCKET:-srbg-raw}
      SRBG_BACKUP_S3_BUCKET: ${SRBG_BACKUP_S3_BUCKET:-srbg-backup}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${SRBG_S3_BUCKET}"
        && mc anonymous set none "local/$${SRBG_S3_BUCKET}"
        && mc version enable "local/$${SRBG_S3_BUCKET}"
        && mc mb --ignore-existing "local/$${SRBG_BACKUP_S3_BUCKET}"
        && mc anonymous set none "local/$${SRBG_BACKUP_S3_BUCKET}"
        && mc version enable "local/$${SRBG_BACKUP_S3_BUCKET}"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-srbg}:${POSTGRES_PASSWORD:-srbg_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  role-init:
    image: srbg-postgres:17.10-pgvector-0.8.2
    build: *postgres-build
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-srbg}
      PGUSER: ${POSTGRES_USER:-srbg}
      PGPASSWORD: ${POSTGRES_PASSWORD:-srbg_local_only}
      API_DB_PASSWORD: ${SRBG_API_DB_PASSWORD:-srbg_api_local_only}
      WORKER_DB_PASSWORD: ${SRBG_WORKER_DB_PASSWORD:-srbg_worker_local_only}
      PUBLISHER_DB_PASSWORD: ${SRBG_PUBLISHER_DB_PASSWORD:-srbg_publisher_local_only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql --set=ON_ERROR_STOP=1 \
          --set=api_password="$${API_DB_PASSWORD}" \
          --set=worker_password="$${WORKER_DB_PASSWORD}" \
          --set=publisher_password="$${PUBLISHER_DB_PASSWORD}" <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'srbg_api_login') THEN
            CREATE ROLE srbg_api_login LOGIN;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'srbg_worker_login') THEN
            CREATE ROLE srbg_worker_login LOGIN;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'srbg_publisher_login') THEN
            CREATE ROLE srbg_publisher_login LOGIN;
          END IF;
        END
        $$$$;
        ALTER ROLE srbg_api_login PASSWORD :'api_password';
        ALTER ROLE srbg_worker_login PASSWORD :'worker_password';
        ALTER ROLE srbg_publisher_login PASSWORD :'publisher_password';
        GRANT srbg_api_role TO srbg_api_login;
        GRANT srbg_worker_role TO srbg_worker_login;
        GRANT srbg_publication_writer TO srbg_publisher_login;
        SQL
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://srbg_api_login:${SRBG_API_DB_PASSWORD:-srbg_api_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
      SRBG_PUBLICATION_DATABASE_URL: postgresql+asyncpg://srbg_publisher_login:${SRBG_PUBLISHER_DB_PASSWORD:-srbg_publisher_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["uvicorn", "srbg_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    hostname: worker
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://srbg_worker_login:${SRBG_WORKER_DB_PASSWORD:-srbg_worker_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["celery", "-A", "srbg_worker.app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A srbg_worker.app:celery_app inspect ping --destination celery@worker --timeout 2
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  parser:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    hostname: parser
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://srbg_worker_login:${SRBG_WORKER_DB_PASSWORD:-srbg_worker_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["celery", "-A", "srbg_worker.app:celery_app", "worker", "--loglevel=INFO", "--queues=parser", "--concurrency=1", "--max-tasks-per-child=25"]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    hostname: ai-worker
    environment:
      SRBG_AI_BROKER_URL: ${SRBG_REDIS_URL:-redis://redis:6379/0}
      SRBG_AI_PROVIDER: ${SRBG_AI_PROVIDER:-mock}
      SRBG_AI_BASE_URL: ${SRBG_AI_BASE_URL:-http://model-gateway.invalid}
      SRBG_AI_REQUEST_PATH: ${SRBG_AI_REQUEST_PATH:-/v1/chat/completions}
      SRBG_AI_API_KEY: ${SRBG_AI_API_KEY:-}
      SRBG_AI_TIMEOUT_SECONDS: ${SRBG_AI_TIMEOUT_SECONDS:-30}
    command: ["celery", "-A", "srbg_worker.ai_app:celery_app", "worker", "--loglevel=INFO", "--queues=ai", "--concurrency=1", "--max-tasks-per-child=50"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A srbg_worker.ai_app:celery_app inspect ping --destination celery@ai-worker --timeout 2
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  publisher:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    hostname: publisher
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://srbg_publisher_login:${SRBG_PUBLISHER_DB_PASSWORD:-srbg_publisher_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
      SRBG_PUBLICATION_DATABASE_URL: postgresql+asyncpg://srbg_publisher_login:${SRBG_PUBLISHER_DB_PASSWORD:-srbg_publisher_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["celery", "-A", "srbg_worker.app:celery_app", "worker", "--loglevel=INFO", "--queues=publisher", "--concurrency=1", "--max-tasks-per-child=50"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.python
    environment:
      <<: *python-environment
      SRBG_DATABASE_URL: postgresql+asyncpg://srbg_worker_login:${SRBG_WORKER_DB_PASSWORD:-srbg_worker_local_only}@postgres:5432/${POSTGRES_DB:-srbg}
    command: ["celery", "-A", "srbg_worker.app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.web
    environment:
      NUXT_INTERNAL_API_BASE: http://api:8000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then((response) => {
          if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    environment:
      METRICS_TOKEN: ${SRBG_METRICS_BEARER_TOKEN:-demo-only-round11-metrics-token-000000}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077; printf %s "$${METRICS_TOKEN}" > /tmp/metrics-token;
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-demo-only-grafana-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-wal-archive:
  redis-data:
  minio-data:
  clamav-db:
  prometheus-data:
  grafana-data:
